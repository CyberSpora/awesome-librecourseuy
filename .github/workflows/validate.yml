name: Validate entries

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Check generator and validator
        run: |
          uv run python scripts/test_build.py
          uv run python scripts/test_validate.py
          uv run python scripts/build.py
          uv run ruff check scripts/
      - name: Validate entries (schema and cross-file checks)
        if: github.event_name != 'pull_request'
        run: uv run python scripts/validate.py --offline
      - name: Validate entries (schema, cross-file, and network checks for changed entries)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=$(git diff --name-only --diff-filter=AMR "$BASE...$HEAD" -- 'entries/*.json')
          uv run python scripts/validate.py --only $changed
