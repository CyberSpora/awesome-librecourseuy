[project]
name = "awesome-librecourseuy"
version = "0.1.0"
description = "Data-driven awesome list for LibreCourseUY. Add a JSON, CI validates and regenerates the README."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
